<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Đấm Nhau FPP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="crosshair"></div>
  <div id="flash"></div>
  <div id="dead">Bạn bị hạ gục!</div>
  <div id="hud"><div id="hpbar"><div id="hpfill"></div></div><div id="weapon-panel"></div></div>
  <div id="board"></div>
  <div id="hotbar"></div>
  <div id="match-timer"></div>
  <div id="banner"></div>
  <div id="match-end" class="screen"></div>
  <div id="room-badge"></div>
  <div id="lobby"></div>
  <div id="countdown"></div>

  <div id="menu" class="screen">
    <h1>Đấm Nhau FPP</h1>
    <div class="panel">
      <canvas id="preview"></canvas>
      <input id="name" maxlength="16" placeholder="Tên của bạn" autocomplete="off">
      <div class="row"><label>Áo</label><div class="opts" id="opt-shirt"></div></div>
      <div class="row"><label>Họa tiết áo</label><div class="opts" id="opt-pattern"></div></div>
      <div class="row"><label>Quần</label><div class="opts" id="opt-pants"></div></div>
      <div class="row"><label>Găng tay</label><div class="opts" id="opt-glove"></div></div>
      <div class="row"><label>Màu da</label><div class="opts" id="opt-skin"></div></div>
      <div class="row"><label>Tóc</label><div class="opts" id="opt-hair"></div></div>
      <div class="buttons">
        <button id="random">Ngẫu nhiên</button>
        <button id="create">Tạo phòng</button>
      </div>
      <button class="settings-open menu-settings">Cài đặt</button>
      <div class="join-row">
        <input id="room-code" inputmode="numeric" maxlength="3" placeholder="Mã phòng" autocomplete="off">
        <button id="join">Vào phòng</button>
      </div>
      <p id="menu-invite"></p>
      <p id="menu-error"></p>
      <p class="help">WASD: di chuyển · Shift: chạy nhanh · Space: nhảy · C (giữ): ngồi<br>Chuột trái: đấm tay trái · Chuột phải: đấm tay phải<br>M: tắt/bật tiếng · Esc: thả chuột<br>Trong phòng: F sẵn sàng · L sao chép link mời bạn bè</p>
    </div>
  </div>

  <div id="pause" class="screen">
    <h1 id="pause-title">Đã tạm dừng</h1>
    <p id="pause-text">Click để tiếp tục</p>
    <button class="settings-open pause-settings">Cài đặt</button>
  </div>

  <div id="settings" class="screen">
    <div class="panel">
      <h2>Cài đặt</h2>
      <div class="setting">
        <div class="setting-head"><label for="set-fov">Góc nhìn (FOV)</label><output id="set-fov-value"></output></div>
        <input id="set-fov" type="range">
      </div>
      <div class="setting">
        <div class="setting-head"><label for="set-sens">Độ nhạy chuột</label><output id="set-sens-value"></output></div>
        <input id="set-sens" type="range">
      </div>
      <div class="buttons">
        <button id="settings-reset">Mặc định</button>
        <button id="settings-close">Đóng</button>
      </div>
    </div>
  </div>

  <script src="/babylon.js"></script>
  <script src="/babylon.gltf-loader.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
